# In production (AgentCore), the ADOT Java agent handles all telemetry export via JAVA_TOOL_OPTIONS.
# Disable Spring Boot's own OTLP exporters (they default to localhost:4318, which doesn't exist in AgentCore).
management.otlp.metrics.export.enabled=false
management.defaults.metrics.export.enabled=false
management.tracing.export.otlp.enabled=false

# 100% sampling in production: ADOT's parentbased_always_on sampler inherits the root span's
# sampling decision, so 5% (the base default) causes 95% of Bedrock spans to be dropped.
management.tracing.sampling.probability=1.0
