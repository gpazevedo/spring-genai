spring.application.name=spring-genai
spring.threads.virtual.enabled=true

management.tracing.sampling.probability=0.05

# Disabled by default — ADOT handles all telemetry export in production.
# Re-enabled/configured in application-local.properties for local observability stack.
management.otlp.metrics.export.enabled=false

# AWS Bedrock Connection
spring.ai.bedrock.aws.region=us-east-1

# Bedrock Converse Chat - Claude Model
spring.ai.bedrock.converse.chat.options.model=us.amazon.nova-lite-v1:0
spring.ai.bedrock.converse.chat.options.temperature=0.7
spring.ai.bedrock.converse.chat.options.max-tokens=1024
