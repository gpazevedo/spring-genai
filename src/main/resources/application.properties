spring.application.name=spring-genai
spring.threads.virtual.enabled=true

# OTLP exporter — override via OTEL_EXPORTER_OTLP_ENDPOINT env var
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.tracing.sampling.probability=1.0

# AWS Bedrock Connection
spring.ai.bedrock.aws.region=us-east-1

# Bedrock Converse Chat - Claude Model
spring.ai.bedrock.converse.chat.options.model=us.anthropic.claude-3-5-sonnet-20241022-v2:0
spring.ai.bedrock.converse.chat.options.temperature=0.7
spring.ai.bedrock.converse.chat.options.max-tokens=1024
