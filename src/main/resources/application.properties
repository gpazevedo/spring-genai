spring.application.name=spring-genai
spring.threads.virtual.enabled=true

# AWS Bedrock Connection
spring.ai.bedrock.aws.region=us-east-1

# Bedrock Converse Chat - Claude Model
spring.ai.bedrock.converse.chat.options.model=us.anthropic.claude-3-5-sonnet-20241022-v2:0
spring.ai.bedrock.converse.chat.options.temperature=0.7
spring.ai.bedrock.converse.chat.options.max-tokens=1024
